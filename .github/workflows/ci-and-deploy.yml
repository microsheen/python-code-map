# code-map -> Cloudflare Pages
#
# 一次构建，两处消费：browser-smoke 与 deploy 下载的是 checks 里产出的同一份 dist/，
# 所以"测试通过"确实约束了用户拿到的那批字节。
#
# 需要的配置（Settings -> Secrets and variables -> Actions，两个不同的标签页，放错边会是静默空串）：
#   Secrets    CLOUDFLARE_API_TOKEN    需要 Pages: Edit + Deployment: Edit；首次绑域名另需 Zone DNS: Edit
#   Secrets    CLOUDFLARE_ACCOUNT_ID   会出现在公开仓库的日志里，所以它是 secret 而不是 variable
#   Variables  DEPLOY_ENABLED          字符串 'true' 才发布。停发布 = 改成 'false'，不改这个文件
#   Variables  PAGES_PROJECT_NAME      Pages 项目名；全局唯一、不可改名，同时也是 <name>.pages.dev 的主机名
#
# 三条不许动的规则：
#   1. 门禁红了就修应用或修 flake：不给任何 job/step 加 continue-on-error，不删 needs。
#   2. 不在 deploy 里重新构建（两次 metro 构建不是同一批字节）。
#   3. 发布地址只从 wrangler 自己的 stdout 解析（"Take a peek over at ..."），不按 SHA 拼。
name: ci-and-deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # 一旦显式写出下面任何一个 scope，没有被写出来的 scope 全部变成 none
  # （workflow-syntax 文档原文："all of those that are not specified are set to none"）。
  # job 之间传 dist/ 靠的是 Actions artifact，归 actions scope 管：少下面这一行，
  # upload/download-artifact 会以 403 "Resource not accessible by integration" 失败，
  # 门禁红在第一步。write 包含 read，所以下游两个 download 也被这条覆盖。
  contents: read
  actions: write

concurrency:
  group: ci-and-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # job 级 if 读不到 env 上下文，所以下面 deploy 的 if 里把分支名又抄了一遍。
  # 这两处必须一起改；改错不会报错，只会让 deploy 静默地永不执行 —— 所以它是
  # "Production branch declared in both places" 断言，不只是注释里的提醒。
  PRODUCTION_BRANCH: main
  # 路线 B 的归属守卫（O1）：这条流水线只属于公开仓库。
  # 内网 GHES 实例上本仓库 runners=0，任何 run 只会排队，最长 24 小时后被自动取消
  # （官方 limits 的用词是 cancelled，不是 failed），等于留下一排没有意义的僵尸 run。
  # 所以三个 job 各自带一条 github.repository 判断，让内网整体 skipped。
  # 同一个字符串抄三遍是 job 级 if 读不到 env 的代价，由
  # "Route B ownership guard present on every job" 断言守住出现次数。
  PUBLISHED_REPO: microsheen/python-code-map

jobs:
  checks:
    if: github.repository == 'microsheen/python-code-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Toolchain pins the npm that generated the lockfile
        run: |
          # package-lock.json 必须由 npm 11.19.0 生成，这里把 runner 的 npm 钉到同一个版本。
          # 为什么钉小版本而不是大版本 —— [实测] 2026-10-13，同一份锁在本机 Windows 上：
          #   npm 11.6.2  npm ci --dry-run  -> exit 0
          #   npm 11.19.0 npm ci --dry-run  -> exit 1，Missing: @emnapi/core@1.11.3 / @emnapi/runtime@1.11.3
          # 与操作系统无关：本机 11.19.0 完整复现了 Actions 上的失败（先前误判为"npm 10/11 大版本
          # 差异"，那条只对 react-native-worklets@0.10.4 成立，对 @emnapi/* 两条不成立）。
          # 机制：@napi-rs/wasm-runtime 把 @emnapi/core|runtime 声明成 peerDependencies，而它自己
          # 挂在 cpu=wasm32 的可选子树里。旧 npm 不把这些 peer 写进锁，新 npm 装树时要求补齐，
          # 锁里没有顶层条目 -> npm ci 直接判锁不完整。
          # 会复发，所以必须钉住 —— [实测] 用本机 npm 11.6.2 跑 install --package-lock-only 会把
          # 这两条顶层条目重新剪掉（1137 -> 1135），锁又变回 CI 装不动的那份。要重新生成锁，用：
          #   npx npm@11.19.0 install --package-lock-only
          # 然后 npm ci + verify + export + 冒烟 + 产物 sha256 基线核对全部重跑一遍。
          set -eu
          want=11.19.0
          harness=$(npm -v)
          if [ "$harness" != "$want" ]; then
            echo "runner 自带 npm $harness，安装 $want 以免 node 小版本悄悄改变依赖树"
            npm install -g "npm@$want"
          fi
          got=$(npm -v)
          echo "node=$(node -v) npm=$got harness=$harness lockfileVersion=$(node -e 'process.stdout.write(String(require("./package-lock.json").lockfileVersion))')"
          if [ "$got" != "$want" ]; then
            echo "::error::npm 钉不到 $want（实际 $got）。锁文件由 $want 生成，换 npm 就等于换依赖树。"
            exit 1
          fi
      - name: Install from lockfile
        run: npm ci

      - name: Invariants (typecheck + lint + jest)
        run: npm run verify

      - name: Contact path cannot send anything (egress + address gate)
        run: npm run audit:egress
        # 反馈是唯一「往外搬信息」的功能，所以它的承诺不能靠 review 自觉。
        # 这道闸门逐字读 src/feedback/contact.ts、FeedbackDialog.tsx、buildStamp.ts：
        # 出现任何请求原语（fetch / beacon / <form> / 剪贴板 …，注释也算）或任何未公开的
        # 邮箱字面量就红。别名门控关闭期间故意不带 --public-address，于是任何邮箱都是 finding。
        # blocking：不加 continue-on-error，也不动 needs。

      - name: Build web bundle (preexport copies wasm, postexport strips HTML comments)
        run: npm run export

      - name: Assert the build output is complete and third-party-free
        run: |
          set -e
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/wasm/tree-sitter.wasm
          test -f dist/wasm/tree-sitter-python.wasm
          ls -1 dist/_expo/static/js/web/entry-*.js
          # postexport 之后不该再有注释，也不该有任何绝对 URL（部署扫描按整段正文算）
          if grep -q '<!--' dist/index.html; then
            echo "::error::dist/index.html 里仍有 HTML 注释，postexport 没有生效"
            exit 1
          fi
          if grep -Eq 'https?://' dist/index.html; then
            echo "::error::dist/index.html 里仍有绝对 URL，部署后会被判为第三方引用"
            exit 1
          fi

      - name: Production branch declared in both places
        run: |
          # deploy 的 job 级 if 读不到 env 上下文，只能把生产分支名再抄一遍（GitHub 的已知限制）。
          # 两处一旦不同步，deploy 的 if 永远为 false：构建全绿、冒烟全绿、什么都没发布，
          # 而且不会有任何报错。所以这是断言，不是文档里的提醒。
          set -eu
          f=.github/workflows/ci-and-deploy.yml
          pat="github.ref_name == '$PRODUCTION_BRANCH'"
          n=$(grep -cF "$pat" "$f" || true)
          if [ "${n:-0}" != "1" ]; then
            echo "::error::deploy 的 if 里匹配 env.PRODUCTION_BRANCH 的判断出现 $n 次（期望 1 次）：0 次会让 deploy 静默地永不执行，多于 1 次说明改默认分支时漏改了"
            exit 1
          fi

      - name: Route B ownership guard present on every job
        run: |
          # O1 守卫必须同时挂在 checks / browser-smoke / deploy 三个 job 上。
          # 谁删掉其中一条，内网 GHES 就会重新开始为每次 push 排一条 24 小时的僵尸 run；
          # 这里是断言，不是文档里的提醒。
          set -eu
          f=.github/workflows/ci-and-deploy.yml
          pat="github.repository == '$PUBLISHED_REPO'"
          n=$(grep -cF "$pat" "$f" || true)
          if [ "${n:-0}" != "3" ]; then
            echo "::error::仓库归属守卫出现 $n 次（期望 3 次：checks / browser-smoke / deploy）。少任何一条，内网实例都会产生排队到超时的僵尸 run。"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14

  browser-smoke:
    # 真 headless Chrome 打在这份产物上，断言的是承诺面：同源 / 全 GET / 零请求体 /
    # URL 里没有用户内容 / 每个 200 都对应 dist 里真实存在的文件 / 生产 CSP 下零违规。
    # 它只读 package.json + scripts + fixtures + dist + src/feedback/contact.ts（冒烟 G 组要拿
    # 源码里的常量核对面板渲染的地址与门控的链接数），不需要 node_modules。
    needs: checks
    if: github.repository == 'microsheen/python-code-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Chrome available
        run: google-chrome --version

      - name: Smoke against the shipped artifact
        run: npm run smoke

      - name: Keep the evidence
        if: always()
        run: |
          mkdir -p smoke-evidence
          cp /tmp/codemap-verify-report.json smoke-evidence/ 2>/dev/null || true
          cp -r /tmp/codemap-shots smoke-evidence/ 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: smoke-evidence
          retention-days: 14

  deploy:
    needs: [checks, browser-smoke]
    # 这四条分别是：这条流水线归谁跑（O1）、不是 PR、是生产分支（与 env.PRODUCTION_BRANCH
    # 手工同步，job 级 if 读不到 env）、发布开关为 true。
    if: ${{ github.repository == 'microsheen/python-code-map' && github.event_name != 'pull_request' && github.ref_name == 'main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Same assertions the gate saw (refuse to publish an incomplete bundle)
        run: |
          set -e
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/wasm/tree-sitter.wasm
          test -f dist/wasm/tree-sitter-python.wasm
          grep -q 'Content-Security-Policy' dist/_headers
          ! grep -Eq 'https?://' dist/index.html

      # wrangler 4.x 的 engines 要求 node >=22（已核过 registry）；这里写 24 是因为锁文件由 npm 11
      # 生成、而 npm 11 随 node 24 分发 —— 理由见 checks 里的 Toolchain 断言，两处必须一致。
      - name: Install pinned wrangler
        run: npm install -g wrangler@4.149.0

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
        run: |
          set -e
          test -n "$PAGES_PROJECT_NAME" || { echo "::error::vars.PAGES_PROJECT_NAME 未设置"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::secrets.CLOUDFLARE_ACCOUNT_ID 未设置"; exit 1; }
          # 幂等 bootstrap：首次创建，之后每次都报"已存在"，两种情况都要能跑通
          wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch "$PRODUCTION_BRANCH" || echo "project 已存在，继续"
          if ! wrangler pages deploy dist --project-name "$PAGES_PROJECT_NAME" --commit-hash "$GITHUB_SHA" > /tmp/wrangler.log 2>&1; then
            cat /tmp/wrangler.log
            echo "::error::wrangler pages deploy 失败（日志见上）"
            exit 1
          fi
          cat /tmp/wrangler.log
          URL=$(sed -n 's|.*Take a peek over at \(https://[^ ]*\).*|\1|p' /tmp/wrangler.log | tail -1)
          {
            echo "## 发布结果"
            echo ""
            echo "- 分支: \`$GITHUB_REF_NAME\`  commit: \`$GITHUB_SHA\`"
            echo "- Pages 项目: \`$PAGES_PROJECT_NAME\`"
            if [ -n "$URL" ]; then
              echo "- 本次部署（不可变 URL，回滚与取证就点它）: $URL"
            else
              echo "- URL: 未能从 wrangler 输出里解析出来 —— 不要猜，直接读上面的日志"
              echo "::warning::部署成功但没能从日志解析出不可变 URL，去 Summaries 或上面的原始日志人工确认"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
